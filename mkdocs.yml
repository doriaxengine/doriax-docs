site_name: Doriax Engine Docs
site_url: 'https://docs.doriax.org'
site_author: 'Eduardo Doria'
site_description: 'Official documentation for the Doriax game engine — a free, lightweight, open-source engine for building 2D and 3D games with Lua or C++.'

repo_name: 'doriaxengine/doriax'
repo_url: 'https://github.com/doriaxengine/doriax'
edit_uri: 'https://github.com/doriaxengine/doriax-docs/edit/main/docs/'

copyright: 'Copyright &copy; 2026 Eduardo Doria. Documentation under CC-BY 4.0.'

watch:
  - theme

theme:
  name: null
  custom_dir: 'theme/'
  logo: 'assets/logo/logo_part1.png'
  favicon: 'assets/logo/logo_part1.png'

extra:
  social:
    - name: GitHub
      link: 'https://github.com/doriaxengine/doriax'
    - name: Discord
      link: 'https://discord.gg/yXXDyJf3gT'
  homepage: 'https://doriax.org'
  analytics:
    property: G-D2G3S99SDC

markdown_extensions:
  - tables
  - md_in_html
  - footnotes
  - attr_list
  - def_list
  - admonition
  - toc:
      permalink: true
      permalink_title: 'Link to this section'
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search

nav:
  - Home: 'index.md'
  - Getting Started:
      - Introduction: 'getting-started/introduction.md'
      - Installation: 'getting-started/installation.md'
      - Your First Project: 'getting-started/first-project.md'
      - The Editor: 'getting-started/the-editor.md'
  - Tutorials:
      - First 2D Scene: 'tutorials/first-2d-scene.md'
      - First 3D Scene: 'tutorials/first-3d-scene.md'
      - First UI Scene: 'tutorials/first-ui-scene.md'
      - Exporting a Project: 'tutorials/exporting-a-project.md'
  - Editor:
      - Editor Overview: 'editor/index.md'
      - Project Workflow: 'editor/project-workflow.md'
