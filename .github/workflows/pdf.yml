name: Build documentation PDF

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    # Applies to the branch only: every tag builds.
    paths:
      - 'scripts/build-pdf.py'
      - 'scripts/print.css'
      - 'requirements*.txt'
      - '.github/workflows/pdf.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build, such as v0.8.4, or main'
        required: true
        default: main

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    env:
      DOCS_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The generator always comes from main; the docs come from DOCS_REF,
          # so tags older than the generator can still be built.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Pango and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-noto-core fonts-noto-mono fonts-noto-cjk \
            fonts-dejavu-core fonts-dejavu-mono

      - name: Install dependencies
        run: pip install -r requirements-pdf.txt

      - name: Build the PDF
        run: scripts/build-pdf.py --ref "$DOCS_REF" --strict --out "dist/doriax-docs-$DOCS_REF.pdf"

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: doriax-docs-pdf
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 90
          # A PDF is already compressed.
          compression-level: 0
